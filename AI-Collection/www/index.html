function toggleTheme(){isDark=!isDark;document.body.dataset.theme=isDark?'dark':'light';lsSet('theme',isDark?'dark':'light');updateThemeUI();}
function updateThemeUI(){document.getElementById('themeBtn').textContent=isDark?'☀�?:'🌙';document.getElementById('themeToggle').classList.toggle('on',isDark);document.querySelector('meta[name=theme-color]').content=isDark?'#080b14':'#f0f2f5';}

function applyBackground(img,op){document.body.style.setProperty('--bg-image',img?'url('+img+')':'none');document.body.style.setProperty('--bg-opacity',op);}
async function loadStats(){try{var r=await fetch(API+'/api/stats');var d=await r.json();document.getElementById('statTotal').textContent=d.total||0;document.getElementById('statCats').textContent=(d.by_category||[]).length;document.getElementById('statsBar').classList.toggle('hidden',d.total===0);}catch(e){}}
async function loadCategories(){try{var r=await fetch(API+'/api/categories');var d=await r.json();categories=d.categories||[];}catch(e){categories=['技�?,'生活','设计','阅读','视频','工具','游戏','音乐','购物','其他'];}renderCategories();}
function renderCategories(){var sel=document.getElementById('addCategory');sel.innerHTML='<option value="">🤖 AI 自动分类</option>'+categories.map(function(c){return '<option value="'+c+'">'+c+'</option>';}).join('');var cont=document.getElementById('catFilters');cont.innerHTML='<button class="'+(currentCat?'':'active')+'" onclick="filterCat(\x27\x27)">全部</button>'+categories.map(function(c){return '<button class="'+(currentCat===c?'active':'')+'" onclick="filterCat(\x27'+c+'\x27)">'+c+'</button>';}).join('');}
function filterCat(cat){currentCat=cat;page=1;hasMore=true;document.querySelectorAll('#catFilters button').forEach(function(b){b.classList.toggle('active',b.textContent===cat||(cat===''&&b.textContent==='全部'));});loadInbox();}
function showTab(tab){currentTab=tab;document.querySelectorAll('.page').forEach(function(p){p.classList.add('hidden');p.classList.remove('fade-in');});var el=document.getElementById('page'+tab.charAt(0).toUpperCase()+tab.slice(1));el.classList.remove('hidden');void el.offsetWidth;el.classList.add('fade-in');document.querySelectorAll('.bottom-nav button').forEach(function(b){b.classList.remove('active');});var nb=document.querySelector('.bottom-nav button[data-tab="'+tab+'"]');if(nb)nb.classList.add('active');if(tab==='add')loadCategories();if(tab==='settings'){loadSettings();loadAppearance();}if(tab==='inbox'){document.getElementById('statsBar').classList.remove('hidden');loadStats();}else{document.getElementById('statsBar').classList.add('hidden');}}
function toast(msg,type){var t=document.getElementById('toast');t.textContent=msg;t.className='toast '+(type||'');t.classList.remove('hidden');clearTimeout(t._timer);t._timer=setTimeout(function(){t.classList.add('hidden');},2200);}async function loadSettings(){try{var r=await fetch(API+'/api/settings');var d=await r.json();document.getElementById('setApiBase').value=d.api_base||'';document.getElementById('setChatModel').value=d.chat_model||'';document.getElementById('setEmbedModel').value=d.embed_model||'';document.getElementById('keyHint').textContent=d.has_key?'已设�? '+d.api_key_masked:'未设�?;}catch(e){}}
async function saveSettings(){var body={api_base:document.getElementById('setApiBase').value,chat_model:document.getElementById('setChatModel').value,embed_model:document.getElementById('setEmbedModel').value};var key=document.getElementById('setApiKey').value;if(key)body.api_key=key;await fetch(API+'/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('setApiKey').value='';loadSettings();toast('API 设置已保�?,'success');}
async function testApi(){document.getElementById('testResult').textContent='测试�?..';try{var r=await fetch(API+'/api/settings/test');var d=await r.json();document.getElementById('testResult').innerHTML=d.ok?'<span style="color:var(--green)">�?连接成功 �?'+d.model+'</span>':'<span style="color:var(--red)">�?'+d.error+'</span>';}catch(e){document.getElementById('testResult').innerHTML='<span style="color:var(--red)">�?请求失败</span>';}}
async function loadInbox(){if(!hasMore)return;var catParam=currentCat?'&category='+encodeURIComponent(currentCat):'';var r=await fetch(API+'/api/items?page='+page+'&limit=20'+catParam);var d=await r.json();var list=document.getElementById('inboxList');if(page===1){list.innerHTML='';showSkeletons();}d.items.forEach(function(item){var card=document.createElement('div');card.className='card type-'+item.type;card.onclick=function(){openDetail(item.id);};card.innerHTML='<div class="card-top"><div class="title">'+esc(item.title||'未命�?)+'</div><span class="type-badge">'+typeIcon(item.type)+'</span></div>'+(item.summary?'<div class="summary">'+esc(item.summary)+'</div>':'')+'<div class="meta">'+(item.tags||[]).slice(0,4).map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'<span class="cat">'+esc(item.category||'其他')+'</span><span class="time">'+timeAgo(item.created_at)+'</span></div>'+(item.url?'<div class="bottom-row"><span class="url-text">🔗 '+esc(item.url)+'</span></div>':'');list.appendChild(card);});hideSkeletons();document.getElementById('inboxEmpty').classList.toggle('hidden',d.total>0||page>1);hasMore=d.items.length===20;page++;}
function showSkeletons(){var sk=document.getElementById('skeletonList');sk.innerHTML='';for(var i=0;i<3;i++){sk.innerHTML+='<div class=skeleton-card><div class=skeleton-line></div><div class=skeleton-line></div><div class=skeleton-line></div></div>';}}
function hideSkeletons(){document.getElementById('skeletonList').innerHTML='';}
function typeIcon(t){return{link:'🔗',text:'📝',image:'🖼',video:'🎬'}[t]||'📄';}
async function pasteFromClipboard(){try{var text=await navigator.clipboard.readText();if(/^https?:\/\//.test(text)){document.getElementById('addUrl').value=text;toast('已粘贴链�?,'success');}else{document.getElementById('addText').value=text;document.getElementById('charCount').textContent=text.length+' �?;toast('已粘贴文�?,'success');}}catch(e){toast('无法访问剪贴�?,'error');}}
async function addItem(e){e.preventDefault();var url=document.getElementById('addUrl').value.trim();var title=document.getElementById('addTitle').value.trim();var category=document.getElementById('addCategory').value;var text=document.getElementById('addText').value.trim();if(!url&&!text&&!title){toast('请输入内�?,'error');return false;}toast('保存�?..');try{var r=await fetch(API+'/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:addType,url:url||null,title:title||null,category:category||null,source_text:text||null})});var d=await r.json();if(d.ok){toast('�?'+d.title,'success');['addUrl','addTitle','addText'].forEach(function(id){document.getElementById(id).value='';});document.getElementById('addCategory').value='';document.getElementById('charCount').textContent='';showTab('inbox');}else{toast(d.detail||'保存失败','error');}}catch(e){toast('请求失败','error');}return false;}
function searchDebounce(){clearTimeout(searchTimer);searchTimer=setTimeout(doSearch,350);}
function clearSearch(){document.getElementById('searchInput').value='';document.getElementById('searchResults').innerHTML='';document.getElementById('searchClearBtn').classList.add('hidden');document.getElementById('searchCount').classList.add('hidden');}
async function doSearch(){var q=document.getElementById('searchInput').value.trim();var c=document.getElementById('searchResults');var clr=document.getElementById('searchClearBtn');var cnt=document.getElementById('searchCount');clr.classList.toggle('hidden',!q);if(!q){c.innerHTML='';cnt.classList.add('hidden');return;}var r=await fetch(API+'/api/search?q='+encodeURIComponent(q));var d=await r.json();cnt.classList.remove('hidden');cnt.textContent='找到 '+d.results.length+' 条结�?;if(!d.results.length){c.innerHTML='<div class=empty-state><span class=emoji>😕</span><p>没有找到结果</p></div>';return;}c.innerHTML=d.results.map(function(item){return '<div class="card type-'+item.type+'" onclick=openDetail('+item.id+')><div class=card-top><div class=title>'+esc(item.title||'未命�?)+'</div></div>'+(item.summary?'<div class=summary>'+esc(item.summary)+'</div>':'')+'<div class=meta>'+(item.tags||[]).map(function(t){return '<span class=tag>'+esc(t)+'</span>';}).join('')+(item.category?'<span class=cat>'+esc(item.category)+'</span>':'')+(item.score?'<span class=tag style=background:rgba(167,139,250,.15);color:var(--purple)>'+Math.round(item.score*100)+'%</span>':'')+'</div></div>';}).join('');}
var currentDetailId=null;
async function openDetail(id){currentDetailId=id;var r=await fetch(API+'/api/items/'+id);var item=await r.json();document.getElementById('modalBody').innerHTML='<div class=editable id=editTitle><h2 onclick="startEdit(\x27title\x27,\x27'+esc(item.title||'')+'\x27)" style=cursor:text>'+esc(item.title||'未命�?)+' <span style=font-size:11px;color:var(--text-dim)>�?/span></h2></div><div class=meta-row>'+(item.tags||[]).map(function(t){return '<span class=tag>'+esc(t)+'</span>';}).join('')+'<span class=cat>'+esc(item.category||'其他')+'</span><span class=time>'+timeAgo(item.created_at)+'</span></div>'+(item.url?'<p style=margin:6px;0><a href="'+esc(item.url)+'" target=_blank style=color:var(--accent2);font-size:13px>🔗 '+esc(item.url)+'</a></p>':'')+'<div class=editable id=editSummary><div class=content-text onclick="startEdit(\x27summary\x27,\x27'+esc(item.summary||'')+'\x27)" style=cursor:text>'+esc(item.summary||item.content||item.source_text||'无内�?)+'</div></div><div style=margin:8px;0;font-size:12px;color:var(--text-dim)><span>分类: </span><select id=editCategory onchange=quickSave() style=padding:4px;8px;border-radius:6px;background:var(--content-bg);color:var(--text);border:1px;solid;var(--input-border);font-size:12px>'+categories.map(function(c){return '<option value="'+c+'" '+(c===item.category?'selected':'')+'>'+c+'</option>';}).join('')+'</select><span style=margin-left:8px>ID: '+item.id+'</span></div><div class=actions>'+(item.url?'<button onclick="window.open(\x27'+esc(item.url)+'\x27)">🔗 打开链接</button>':'')+'<button class=primary onclick="startEdit(\x27title\x27,\x27'+esc(item.title||'')+'\x27)">✏️ 改标�?/button><button class=danger onclick=deleteItem('+item.id+')>🗑 删除</button></div>';document.getElementById('modal').classList.remove('hidden');}
function startEdit(field,currentVal){var el=document.getElementById(field==='title'?'editTitle':'editSummary');el.innerHTML=field==='title'?'<input id=editInput value="'+currentVal+'" onblur="saveEdit(\x27'+field+'\x27)" onkeydown="if(event.key===\x27Enter\x27)saveEdit(\x27'+field+'\x27)" autofocus>':'<textarea id=editInput onblur="saveEdit(\x27'+field+'\x27)" style=height:80px>'+currentVal+'</textarea>';document.getElementById('editInput').focus();}
async function saveEdit(field){var input=document.getElementById('editInput');if(!input)return;var val=input.value.trim();if(!currentDetailId)return;await fetch(API+'/api/items/'+currentDetailId,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({[field]:val})});openDetail(currentDetailId);page=1;hasMore=true;loadInbox();}

function closeModal(e){if(e&&e.target!==document.getElementById('modal'))return;document.getElementById('modal').classList.add('hidden');}
async function deleteItem(id){if(!confirm('确定删除�?))return;await fetch(API+'/api/items/'+id,{method:'DELETE'});document.getElementById('modal').classList.add('hidden');toast('已删�?,'success');page=1;hasMore=true;loadInbox();loadStats();}
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function timeAgo(d){if(!d)return'';var diff=(Date.now()-new Date(d).getTime())/1000;if(diff<60)return'刚刚';if(diff<3600)return Math.floor(diff/60)+'分钟�?;if(diff<86400)return Math.floor(diff/3600)+'小时�?;if(diff<2592000)return Math.floor(diff/86400)+'天前';return new Date(d).toLocaleDateString('zh-CN');}

window.addEventListener('scroll',function(){if(currentTab!=='inbox')return;var st=document.documentElement.scrollTop,sh=document.documentElement.scrollHeight,ch=document.documentElement.clientHeight;if(st+ch>sh-350&&hasMore&&!scrollLoading){scrollLoading=true;loadInbox().finally(function(){scrollLoading=false;});}});
