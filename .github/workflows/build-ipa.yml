name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Fastlane
        run: gem install fastlane -N --no-document

      - name: Get Team ID & Build
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Use Spaceship to discover the Personal Team ID
          TEAM_ID=$(ruby -e '
            require "spaceship"
            Spaceship.login(ENV["APPLE_ID"], ENV["APPLE_APP_SPECIFIC_PASSWORD"])
            team = Spaceship.client.teams.first
            puts team["teamId"]
          ' 2>&1)
          
          echo "Team ID: $TEAM_ID"
          
          if [ -z "$TEAM_ID" ]; then
            echo "ERROR: Could not discover team ID"
            exit 1
          fi
          
          # Build with discovered team ID
          xcodebuild archive \
            -project AI-Collection.xcodeproj \
            -scheme AI-Collection \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            "DEVELOPMENT_TEAM=$TEAM_ID" \
            -allowProvisioningUpdates \
            2>&1

      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/export
          cat > $RUNNER_TEMP/exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST
          
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -allowProvisioningUpdates \
            2>&1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Collection.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
