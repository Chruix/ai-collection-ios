name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Fastlane
        run: gem install fastlane -N --no-document

      - name: Auth & discover Team ID
        id: team
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          mkdir -p fastlane
          
          TEAM_ID=$(ruby -e '
            require "spaceship"
            begin
              Spaceship::Portal.login(ENV["APPLE_ID"], ENV["APPLE_APP_SPECIFIC_PASSWORD"])
              team = Spaceship::Portal.client.teams.first
              if team
                puts team["teamId"]
              else
                $stderr.puts "ERROR: No teams found"
                exit 1
              end
            rescue => e
              $stderr.puts "Spaceship error: #{e.class}: #{e.message}"
              $stderr.puts e.backtrace.first(5).join("\n")
              exit 1
            end
          ' 2>/tmp/spaceship_err.txt) || true
          
          if [ -z "$TEAM_ID" ]; then
            echo "=== Spaceship login failed ==="
            cat /tmp/spaceship_err.txt
            echo ""
            echo "=== Diagnostic info ==="
            echo "Apple ID prefix: ${APPLE_ID:0:5}***"
            echo "This ID may need to accept developer terms first."
            echo "Please visit https://developer.apple.com/account/ and sign in."
            exit 1
          fi
          
          echo "Team ID: $TEAM_ID"
          echo "team_id=$TEAM_ID" >> $GITHUB_OUTPUT

      - name: Build archive
        run: |
          xcodebuild archive \
            -project AI-Collection.xcodeproj \
            -scheme AI-Collection \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            "DEVELOPMENT_TEAM=${{ steps.team.outputs.team_id }}" \
            -allowProvisioningUpdates \
            2>&1

      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/export
          cat > $RUNNER_TEMP/exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -allowProvisioningUpdates \
            2>&1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Collection.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
