name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build archive (sign with Personal Team)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Open keychain
          security unlock-keychain -p "" ~/Library/Keychains/login.keychain-db 2>/dev/null || true
          security set-key-partition-list -S apple-tool:,apple: -s -k "" \
            ~/Library/Keychains/login.keychain-db 2>/dev/null || true

          # Register Apple ID (generates a free personal provisioning profile)
          xcodebuild archive \
            -project AI-Collection.xcodeproj \
            -scheme AI-Collection \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" \
            -allowProvisioningUpdates \
            2>&1

      - name: Export IPA (development, side-loadable)
        run: |
          mkdir -p $RUNNER_TEMP/export
          ARCHIVE_DIR=$(find "$RUNNER_TEMP/AI-Collection.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" -print -quit)
          mkdir -p Payload
          cp -R "$ARCHIVE_DIR" Payload/
          zip -r $RUNNER_TEMP/export/AI-Collection.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Collection.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
