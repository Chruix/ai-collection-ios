name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Fastlane
        run: gem install fastlane -N --no-document

      - name: Discover Team ID
        id: team
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          cat > Fastfile << 'FASTFILE'
          lane :get_team do
            require 'spaceship'
            Spaceship.login(ENV['APPLE_ID'], ENV['APPLE_APP_SPECIFIC_PASSWORD'])
            team = Spaceship.client.teams.first
            if team.nil?
              UI.user_error!("No teams found for this Apple ID")
            end
            File.write('/tmp/team_id.txt', team['teamId'])
            UI.message("Team ID: #{team['teamId']}")
          end
          FASTFILE
          
          fastlane get_team 2>&1
          TEAM_ID=$(cat /tmp/team_id.txt)
          echo "team_id=$TEAM_ID" >> $GITHUB_OUTPUT

      - name: Build archive
        run: |
          xcodebuild archive \
            -project AI-Collection.xcodeproj \
            -scheme AI-Collection \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            "DEVELOPMENT_TEAM=${{ steps.team.outputs.team_id }}" \
            -allowProvisioningUpdates \
            2>&1

      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/export
          cat > $RUNNER_TEMP/exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -allowProvisioningUpdates \
            2>&1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Collection.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
