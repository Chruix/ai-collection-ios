name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build & sign with keychain auth
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # Create temp keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 7200 $KEYCHAIN_PATH

          # Store Apple ID creds where xcodebuild can find them
          security add-generic-password \
            -a "$APPLE_ID" \
            -s "Xcode-AlternateDSID" \
            -w "$APPLE_APP_SPECIFIC_PASSWORD" \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild \
            -T /usr/bin/codesign \
            $KEYCHAIN_PATH

          # Also store as internet password for idmsa
          security add-internet-password \
            -a "$APPLE_ID" \
            -s "idmsa.apple.com" \
            -w "$APPLE_APP_SPECIFIC_PASSWORD" \
            -r "htps" \
            -T /usr/bin/security \
            -T /usr/bin/xcodebuild \
            $KEYCHAIN_PATH

          # Let xcodebuild handle everything: team discovery, cert, profile, signing
          xcodebuild archive \
            -project AI-Collection.xcodeproj \
            -scheme AI-Collection \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            2>&1

          # Clean up
          security delete-keychain $KEYCHAIN_PATH || true

      - name: Export IPA
        run: |
          mkdir -p $RUNNER_TEMP/export
          cat > $RUNNER_TEMP/exportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist $RUNNER_TEMP/exportOptions.plist \
            -allowProvisioningUpdates \
            2>&1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-Collection.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
