name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Import Apple credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          # 创建临时钥匙串
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH

          # 存储 Apple ID 凭证
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --apple-id "$APPLE_ID" \
            --team-id "" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD"

      - name: Set bundle ID
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier com.chruix.aicollection" \
            AI-Collection/Info.plist

      - name: Build archive
        run: |
          xcodebuild archive \
            -project AI-Collection.xcodeproj \
            -scheme AI-Collection \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            -allowProvisioningUpdates \
            -authenticationKeyID "" \
            -authenticationKeyIssuerID "" \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1

      - name: Export IPA
        run: |
          mkdir -p export
          cat > export/exportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string></string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/AI-Collection.xcarchive \
            -exportPath $RUNNER_TEMP/export \
            -exportOptionsPlist export/exportOptions.plist \
            -allowProvisioningUpdates \
            2>&1

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI-Collection.ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
